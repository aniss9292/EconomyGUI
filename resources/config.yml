# ╔══════════════════════════════════════════╗
# ║        EconomyGUI - config.yml           ║
# ╚══════════════════════════════════════════╝

shop-title: "§l§6» §r§eShop §l§6«"

sell-title: "§l§2» §r§aSell Chest §l§2«"

confirm-sell-title: "§l§e» §r§6Confirm Sell §l§e«"

currency-symbol: "$"

default-category: "general"

default-category-icon: 54

purchase-cooldown: 0

log-transactions: true

# Undo time limit in seconds (default: 5 minutes = 300)
undo-time-limit: 300

sounds:
  enabled: true
  on-purchase: "random.orb"
  on-sell: "random.orb"
  on-error: "mob.villager.no"

buy-slots:
  - slot: 11
    amount: 1
  - slot: 13
    amount: 10
  - slot: 15
    amount: 64

sell-multipliers:
  - slot: 11
    multiplier: 1
  - slot: 13
    multiplier: 2
  - slot: 15
    multiplier: 5

back-button-meta: 14
back-button-name: "§r§c« Back"

messages:
  shop-opened:       "§8[§aEconomy§bGUI§8] §7» §aShop opened! §fType §e/shopbalance §fto check your §6balance§f."
  purchase-success:  "§8[§aEconomy§bGUI§8] §a[+] §fBought §e{amount}x §6{item} §ffor §a{symbol}{price}§f!"
  sell-success:      "§8[§aEconomy§bGUI§8] §a[+] §fSold §e{amount}x §6{item} §ffor §a{symbol}{price}§f!"
  not-enough-money:  "§8[§aEconomy§bGUI§8] §c[-] §fNeed §e{symbol}{needed} §7more to buy§f!"
  not-enough-items:  "§8[§aEconomy§bGUI§8] §c[-] §fNeed §e{amount}x §6{item} §8— §7have §e{has} §7only§f."
  inventory-full:    "§8[§aEconomy§bGUI§8] §c[-] §fInventory is §cfull§7!"
