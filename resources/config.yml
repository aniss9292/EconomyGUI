  balance:           "§8[§aEconomy§bGUI§8] §7» §fBalance§8: §6{symbol}{balance}"
  free-purchase:     "§8[§aEconomy§bGUI§8] §b[/] §fGot §e{amount}x §6{item} §bfor free §8(§7admin perk§8)§f!"
  item-added:        "§8[§aEconomy§bGUI§8] §7» §aAdded §6{item} §8(§eID §e{id}:{meta}§8) §7to §a{category} §8| §fPrice§8: §a{symbol}{price} §8| §fAmt§8: §e{amount}§f."
